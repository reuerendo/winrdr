name: Build EPUB Reader

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create libs directory
      run: New-Item -ItemType Directory -Force -Path libs
    
    - name: Download miniz
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/richgel999/miniz/master/miniz.h" -OutFile "libs/miniz.h"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/richgel999/miniz/master/miniz.c" -OutFile "libs/miniz.c"
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EpubReader-Windows
        path: build/Release/EpubReader.exe