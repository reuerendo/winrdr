name: Build EPUB Reader

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create libs directory
      run: New-Item -ItemType Directory -Force -Path libs
    
    - name: Download and build litehtml
      run: |
        Invoke-WebRequest -Uri "https://github.com/litehtml/litehtml/archive/refs/tags/v0.9.tar.gz" -OutFile "litehtml.tar.gz"
        tar -xzf litehtml.tar.gz
        Move-Item litehtml-0.9 libs/litehtml
        Remove-Item litehtml.tar.gz
    
    - name: Download and build gumbo-parser
      run: |
        Invoke-WebRequest -Uri "https://github.com/google/gumbo-parser/archive/refs/heads/master.zip" -OutFile "gumbo.zip"
        Expand-Archive -Path "gumbo.zip" -DestinationPath "libs"
        Move-Item libs/gumbo-parser-master libs/gumbo-parser
        Remove-Item gumbo.zip
    
    - name: Download miniz
      run: |
        Invoke-WebRequest -Uri "https://github.com/richgel999/miniz/releases/download/2.1.0/miniz-2.1.0.zip" -OutFile "miniz.zip"
        Expand-Archive -Path "miniz.zip" -DestinationPath "libs/miniz_temp"
        Copy-Item "libs/miniz_temp/miniz.h" "libs/miniz.h"
        Copy-Item "libs/miniz_temp/miniz.c" "libs/miniz.c"
        Remove-Item -Recurse -Force "libs/miniz_temp"
        Remove-Item "miniz.zip"
    
    - name: Download stb_image
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "libs/stb_image.h"
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EpubReader-Windows
        path: build/Release/EpubReader.exe