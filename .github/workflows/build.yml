name: Build EPUB Reader

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
    
    - name: Create libs directory
      run: New-Item -ItemType Directory -Force -Path libs
    
    - name: Download miniz
      run: |
        Invoke-WebRequest -Uri "https://github.com/richgel999/miniz/releases/download/2.1.0/miniz-2.1.0.zip" -OutFile "miniz.zip"
        Expand-Archive -Path "miniz.zip" -DestinationPath "libs/miniz_temp"
        Copy-Item "libs/miniz_temp/miniz.h" "libs/miniz.h"
        Copy-Item "libs/miniz_temp/miniz.c" "libs/miniz.c"
        Remove-Item -Recurse -Force "libs/miniz_temp"
        Remove-Item "miniz.zip"
    
    - name: Download stb_image
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "libs/stb_image.h"
    
    - name: Download lexbor
      run: |
        Invoke-WebRequest -Uri "https://github.com/lexbor/lexbor/archive/refs/tags/v2.6.0.zip" -OutFile "lexbor.zip"
        Expand-Archive -Path "lexbor.zip" -DestinationPath "libs"
        Move-Item "libs/lexbor-2.6.0" "libs/lexbor"
        Remove-Item "lexbor.zip"
    
    - name: Build lexbor
      run: |
        cd libs/lexbor
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=OFF -DLEXBOR_BUILD_STATIC=ON
        cmake --build build --config Release
        Write-Host "`n=== All .lib files in lexbor build ==="
        Get-ChildItem -Path build -Recurse -Filter "*.lib" | ForEach-Object {
          Write-Host "  $($_.FullName)"
        }
        Write-Host "=== End of library list ===`n"
        cd ../..
    
    - name: Clean build directory
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON
    
    - name: Verify CMake configuration
      run: |
        Write-Host "`n=== CMake Cache Variables ==="
        Get-Content build/CMakeCache.txt | Select-String "LEXBOR"
        Write-Host "=== End of cache ===`n"
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EpubReader-Windows
        path: build/Release/EpubReader.exe